<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMAZON</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 30px 20px;
            background-color: #f3f3f3;
            color: #111;
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo img {
            width: 180px;
        }

        .container {
            max-width: 430px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            margin-bottom: 12px;
        }

        button {
            background: #f0c14b;
            border: 1px solid #a88734;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        .note{
            font-size:12px;
            color:#555;
            margin-top:-5px;
            margin-bottom:5px;}

        a {
            color: #0066c0;
        }
    </style>
</head>
<body>

    <div class = "logo">
    <img src="amazon_logo.png" alt="Amazon Logo">
    </div>

    <div class = "container">

        <h1>CREATE ACCOUNT</h1>

        <form action="" method="get">

            <label>Your name: </label>
            <input type="text" name="Your name" placeholder="First name and Last name" required > 
            <br><br>

            <label>Mobile number or Email: </label>
            <input type="text" required > 
            <br><br>

            <label>Password: </label>
            <input type="password" id="password" name="password" placeholder="At least 6 characters" minlength="6" required > 
        
            <div class="note">
                <a href="#">i</a>
            Passwords must be at least 6 characters.
            </div>
            <br>


            <label>Re-enter password: </label>
            <input type="password" id="confirmPassword" name="confirmPassword" required > 
            <br><br>

            <button type="submit"> Continue</button>

        </form>

        <p>
            By creating account, you agree to use Amazon's 
            <a href="#">Conditions of Use</a> and
            <a href="#">Privacy Notice</a>. 
        </p>

        <br>
        <hr>

        <p>Already have an account?
            <a href="#"> Sign in</a><br>
            Buying for work?
            <a href="#"> Create a free business account</a><br>
        </p>
    </div>

</body>
</html>
