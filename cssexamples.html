 <!-- there are three types of css:
  1.Inline css-is used to add custom property to specific element
  2.Internal css-is used to apply custom style to multiple element on same page
  3.External cs- we create a separate file with extension.css -->
 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="cssexamples.css">
    <style>
        p{
            color: blue;
            font-family: 'Times New Roman', Times, serif;
            background-color: aquamarine;
        }
    </style>
    
</head>
<body>
    <!-- Inline css -->
     <h1 style="color:pink">Good Morning Everyone!</h1>
     <!-- Internal css -->
      <p> This is a internal css</p>
      <p>Good Morning</p>
      <!-- External css -->
       <h2> We are learning types of css</h2>
     
</body>
</html>
